<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCE9F7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prop Check NBA">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Prop Check NBA</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-sans-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-mono-600.woff2" crossorigin>
<style>
/* Prop Check NBA. A dense betting sheet in the Ballpark theme (Matt, 2026-11-04; copied from Prop Check NHL): light only,
   hairlines instead of shadows, Graduate headlines, IBM Plex Sans body, IBM Plex Mono odds and numbers. */
@font-face{font-family:"Graduate";src:url("fonts/graduate-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/ibm-plex-mono-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/ibm-plex-mono-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  /* Ballpark: Clear Sky bg, Home Whites surface, Dugout Navy text, Slate muted + losses, Stitch Red main buttons + wins,
     Pinstripe links + live, Chalk Line borders, Selected Tint / Deep Stitch for a selected pick */
  --bg:#DCE9F7; --surface:#F4F8FD; --raise:#E8F0F9; --line:#B9CDE6; --line2:#9DB4D2;
  --fg:#0B1F3A; --fg2:#22385A; --muted:#4A6181;
  --accent:#1E5AA8; --accent-soft:rgba(30,90,168,.10); --on-accent:#F4F8FD;
  --primary:#C8102E; --on-primary:#F4F8FD; --selected-bg:#FBE3E7; --selected-text:#A00D25;
  --good:#C8102E; --good-soft:rgba(200,16,46,.08); --good-rgb:200,16,46;
  --warn:#0B1F3A; --warn-soft:rgba(11,31,58,.07);
  --bad:#4A6181; --bad-soft:rgba(74,97,129,.10); --bad-rgb:74,97,129;
  --head:"Graduate",Georgia,serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cond:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --w:clamp(52px,14.5vw,60px); --h:clamp(50px,7.2vh,58px);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px); --sal:env(safe-area-inset-left,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;
  font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mu{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
[hidden]{display:none!important}

/* page column: everything right of the rail */
.wrap{max-width:560px;margin:0 0 0 calc(var(--w) + var(--sal));padding:0 14px calc(28px + var(--sab));min-height:100vh}
@media (min-width:640px){.wrap{margin-left:calc(var(--w) + 24px)}}

/* header */
.hdr{position:sticky;top:0;z-index:6;display:flex;align-items:baseline;gap:10px;margin:0 -14px;padding:calc(var(--sat) + 14px) 14px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.hdr h1{font:400 20px/26px var(--head);letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap}
.tag-test{margin:0 -14px;padding:calc(var(--sat) + 3px) 14px 3px;font-size:11px;line-height:16px;color:var(--warn);background:var(--warn-soft);border-bottom:1px solid var(--line)}
.tag-test+.hdr{padding-top:12px;top:0}

/* freshness strip: one tappable line at the top of every tab */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.live{display:inline-block;width:7px;height:7px;margin-right:7px;vertical-align:1px;border-radius:50%;background:var(--accent)}
.live.warn{background:var(--warn)} .live.bad{background:var(--primary)}
.statusline{font-size:12.5px;line-height:17px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline .lowpool,.statusline .wt{color:var(--warn);font-weight:600}

/* banners: a 3px meaning bar on the left, plain text */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:12px;border-left:3px solid var(--warn);background:var(--warn-soft);font-size:13.5px;line-height:19px;border-radius:0 6px 6px 0}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-left-color:var(--primary);background:var(--selected-bg)} .banner.stop .ic{color:var(--primary)}
.banner.info{border-left-color:var(--accent);background:var(--accent-soft)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:650;color:var(--fg)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere;color:var(--fg2)}
.linkbtn{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.since{margin-top:12px;font-size:13px;line-height:18px;color:var(--accent);font-weight:600}

/* sections */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.sec-h h2{font:400 16px/22px var(--head);letter-spacing:.01em;margin:0;flex:1;min-width:0}
.sec-h .mu{font-size:12px;line-height:16px}
.card.empty{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty .t{font-size:15px;line-height:21px;font-weight:650;color:var(--fg)}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.note{font-size:13px;line-height:18px;color:var(--muted);margin-top:12px}

/* pick tiles: a 2-column board, best first; a tapped tile opens full width */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:8px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;padding:10px 10px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tile[role=button]{cursor:pointer}
.tile.open{grid-column:1 / -1;border-color:var(--primary);background:var(--selected-bg)}
.tile.open .nm{color:var(--selected-text)}
.tile .top{display:flex;gap:8px;align-items:center;min-width:0}
.hs{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--raise);border:1px solid var(--line)}
.tile .nm{min-width:0;font:600 15px/19px var(--cond);letter-spacing:.005em;overflow-wrap:anywhere}
.tile .row2{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:8px}
.tile .bt{min-width:0;font:600 13.5px/18px var(--num);letter-spacing:0;color:var(--fg2);overflow-wrap:anywhere}
.tile .pr{flex:none;font:600 21px/24px var(--num);color:var(--fg);white-space:nowrap}
.tile .pr.noprice{font-size:15px;color:var(--muted)}
.tile .cv{font-size:12.5px;line-height:17px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tile .cv b{font-weight:700;color:var(--good)}
.tile .cv b.short{color:var(--bad)}
.tile .cv span{color:var(--fg2)}
.tile .ft{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;font-size:11.5px;line-height:15px}
.tagx{display:inline-flex;align-items:center;gap:3px;color:var(--fg2);white-space:nowrap}
.tagx.ok{color:var(--good)}
.tagx.new{color:var(--accent);font-weight:700;letter-spacing:.04em}
.newlbl{position:absolute;top:-1px;right:-1px;padding:2px 7px 2px;border-radius:0 8px 0 6px;background:var(--accent);color:var(--on-accent);font:700 10.5px/14px var(--body);letter-spacing:.08em}
.tile.isnew{border-color:var(--accent)}
.tile.isnew .top{padding-right:30px}
.tagx svg{flex:none}
.own{display:inline-block;font:700 12px/16px var(--cond);letter-spacing:.06em;color:var(--fg);padding:0 4px;border:1px solid var(--line2);border-radius:3px;vertical-align:1px}
/* settled track (segmented stepper, driven by the pick's real state): Early -> Lineup -> Locked */
.stp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stp .trk{display:inline-flex;align-items:center}
.stp .n{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2);background:transparent}
.stp .c{width:6px;height:1.5px;background:var(--line2)}
.stp .n.on{border-color:currentColor;background:currentColor}
.stp .n.skip{border-style:dashed;border-color:currentColor}
.stp .c.on{background:currentColor}
.stp.early{color:var(--warn)} .stp.ok{color:var(--good)} .stp.lock{color:var(--muted)}
.stp .t{color:inherit;font-weight:600}
.stp.lock .t{color:var(--fg2)}
.xp .stp .n{width:8px;height:8px} .xp .stp .c{width:10px}
.chip.hollow{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--line2);border-radius:4px;font-size:11.5px;color:var(--fg2)}
/* opened tile */
.xp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px;color:var(--fg2)}
.xp>*+*{margin-top:8px}
.xp b{color:var(--fg);font-weight:700}
.xp .ag{color:var(--good);font-weight:600}
.xp .meta{font-size:12.5px;line-height:18px;color:var(--muted)}
.xp .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;line-height:18px}
.hist{margin:0;padding:0;list-style:none;font-size:12px;line-height:17px;color:var(--muted)}
.hist li{display:flex;gap:8px}
.hist time{flex:none;min-width:58px}
/* chance vs break-even: an edge meter. Centre tick = what the price needs, dot = our chance, red run = the edge */
.bar{position:relative;height:14px}
.bar::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line2);border-radius:1px}
.bar::after{content:"";position:absolute;left:0;right:0;top:4px;height:6px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.bar i{position:absolute;top:6px;height:2px;background:var(--good)}
.bar i.short{background:var(--bad)}
.bar u{position:absolute;top:1px;height:12px;width:2px;margin-left:-1px;background:var(--fg)}
.bar em{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--bg)}
.bar em.short{background:var(--bad)}
.chance{font-size:13.5px;line-height:19px;color:var(--fg2)}
.chance b{font-weight:700;color:var(--fg)}
/* tap to bet */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:6px;
  border:1px solid var(--line2);color:var(--fg);font:600 15px/20px var(--body)}
.btn.wide{width:100%}
.btn.hr{width:100%;background:var(--primary);color:var(--on-primary);border-color:var(--primary);text-decoration:none;white-space:nowrap}
/* TOO LATE: off the board before tip. Solid Dugout Navy stamp, the tile dimmed under it; the price is not struck */
.tile.late{border-color:var(--line)}
.tile.late .dimmed{opacity:.5}
.tl{display:block;margin:0 0 8px;padding:2px 0;border:1.5px solid var(--warn);border-radius:4px;color:var(--surface);background:var(--warn);text-align:center;
  font:700 14px/18px var(--cond);letter-spacing:.14em}
.tile.late .keep{margin-top:8px;font-size:12px;line-height:16px;color:var(--fg2)}

/* live */
.tonight{margin-top:12px;font:400 18px/24px var(--head);letter-spacing:.01em}
.lvnote{margin-top:6px;font-size:12.5px;line-height:17px;color:var(--warn)}
.lvupd{margin-top:6px;font-size:12.5px;line-height:17px;color:var(--muted)}
.lvupd.bad{color:var(--warn);font-weight:600}
.lvlist{margin-top:8px}
.lv{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lv .hs{margin-top:2px}
.lv .nm{font:600 16px/21px var(--cond);overflow-wrap:anywhere}
.lv .bt{font-size:13px;line-height:18px;color:var(--fg2);overflow-wrap:anywhere}
.lv .gs{font-size:12.5px;line-height:17px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.lv .gs b{color:var(--fg2);font-weight:600}
.lv .rt{text-align:right;min-width:52px}
.lv .pp{display:block;font:600 18px/22px var(--num);color:var(--fg2);white-space:nowrap}
.stmp{display:inline-block;margin-top:5px;padding:1px 6px;border:1.5px solid var(--muted);border-radius:4px;color:var(--muted);font:700 13px/16px var(--cond);letter-spacing:.1em}
.stmp.W{border-color:var(--good);color:var(--good)} .stmp.L{border-color:var(--bad);color:var(--bad)}
.trk2{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:12.5px;line-height:17px;color:var(--fg2)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);background:transparent}
.pip.on{background:var(--good);border-color:var(--good)}
.pip.used{background:var(--warn);border-color:var(--warn)}
.pip.lose{border-color:var(--bad)}
.pip.lose.on{background:var(--bad)}
.lv.fin .nm,.lv.fin .pp{color:var(--fg2)}
/* stat meter for bigger lines (points, rebounds, assists): fill = his number so far, tick = the line */
.meter{position:relative;display:inline-block;width:96px;height:8px;border-radius:4px;background:var(--raise);border:1px solid var(--line2);overflow:hidden;vertical-align:middle}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.meter i.on{background:var(--good)} .meter i.used{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter u{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg)}

/* games */
.gl{margin-top:4px}
.gm{padding:12px 0;border-bottom:1px solid var(--line)}
.gm .g1{display:flex;align-items:baseline;gap:8px}
.gm .mt{flex:1;min-width:0;font:600 16px/22px var(--cond);letter-spacing:.01em}
.gm .pt{flex:none;font-size:13px;color:var(--fg2);white-space:nowrap}
.ck{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:18px;color:var(--fg2)}
.ck li{display:flex;gap:6px;align-items:flex-start;padding:1px 0}
.ck li .i{flex:none;display:flex;width:14px;height:18px;align-items:center;color:var(--accent)}
.ck li.wait .i{color:var(--muted)}
.ck li.nx{color:var(--accent)} .ck li.nx .i{color:var(--accent)}
.ck li.warn{color:var(--warn)} .ck li.warn .i{color:var(--warn)}
.ck li.done{color:var(--accent)}
.ck time{color:var(--fg);font-weight:600;white-space:nowrap}
.gm.started .mt{color:var(--muted)}

/* empty + skeleton */
.skel{position:relative;height:118px;border-bottom:1px solid var(--line)}
.skel::before,.skel::after{content:"";position:absolute;left:30px;background:var(--raise);border-radius:2px}
.skel::before{top:18px;width:55%;height:16px}
.skel::after{top:46px;width:38%;height:12px}
.skel.sm::before,.skel.sm::after{display:none}
.skel.sm{height:20px;width:60%;border:0;background:var(--raise);border-radius:3px;margin-top:14px}
.loading{font-size:13px;margin:12px 0 4px}
.stack>*+*{border-top:1px solid var(--line)}

/* footer */
.foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* side rail dock: the page's navigation, pinned to the left edge */
.tabs{position:fixed;left:0;top:0;bottom:0;z-index:7;width:calc(var(--w) + var(--sal));padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 8px) var(--sal);
  background:var(--surface);border-right:1px solid var(--line)}
.rail{position:relative;display:flex;flex-direction:column;height:100%}
.rail .grp{position:relative;display:flex;flex-direction:column}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:var(--w);height:var(--h);color:var(--muted)}
.tab .ico{display:flex;align-items:center;justify-content:center;width:36px;height:30px;border-radius:7px;transition:background-color .2s,color .2s}
.tab .cap{font:600 11px/12px var(--cond);letter-spacing:.03em;color:var(--accent);display:none;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ico{background:var(--accent-soft)}
.tab[aria-current="page"] .cap{display:block}
.tab .lbl{position:absolute;left:calc(100% + 6px);top:50%;z-index:2;padding:5px 10px;border-radius:5px;background:var(--raise);border:1px solid var(--line2);
  color:var(--fg);font:600 13px/18px var(--body);white-space:nowrap;pointer-events:none;
  opacity:0;transform:translate(-8px,-50%);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.tab:hover .lbl{opacity:1;transform:translate(0,-50%)} .tab:hover{color:var(--fg)} .tab[aria-current="page"]:hover{color:var(--accent)}}
.tab:focus-visible{outline:none}
.tab:focus-visible .ico{outline:2px solid var(--accent);outline-offset:1px}
.tab:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
.tab .dot{position:absolute;top:calc(50% - 15px);right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tab .dot.ok{background:var(--accent)} .tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--primary)}
.rail .ind{position:absolute;left:0;top:0;width:3px;height:var(--h);border-radius:0 2px 2px 0;background:var(--accent);opacity:0;pointer-events:none}
.rail .ind.on{opacity:1}
.rail.ready .ind{transition:transform .28s cubic-bezier(.3,.7,.2,1),height .28s}
@media (prefers-reduced-motion:reduce){
  .rail.ready .ind,.tab .lbl,.tab .ico{transition:none}
}

/* record */
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:14px}
.big .wl{font:600 38px/46px var(--num);letter-spacing:.01em}
.big .un{font:600 26px/34px var(--num)}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.allbets{font:400 16px/22px var(--head);margin-top:6px}
.hitline{margin-top:10px}
.hitline .bar{margin-top:4px}
.tbl{margin-top:8px;font-size:13px;line-height:18px;border-top:1px solid var(--line2)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 54px 86px;column-gap:6px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:11px;line-height:15px;color:var(--muted);padding:6px 0 5px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .num{font:600 15px/18px var(--num)}
.tr .lbl small{display:block;font-size:11px;line-height:14px;color:var(--warn)}
.tr .hv{font-size:12px;color:var(--fg2)}
button.tr{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

button.tr.open{background:var(--selected-bg);border-bottom-color:transparent}

.cutl{padding:2px 0 10px 12px;border-left:2px solid var(--selected-text);margin:0 0 6px;background:var(--surface)}
.cutl .cutd{font-size:11px;line-height:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}

.cut h3,.night h3,.cal-h h3{font:400 14px/20px var(--head);letter-spacing:.01em;margin:0}
.cut{margin-top:16px}
.cut .cn{font-size:11.5px;line-height:15px;color:var(--muted);margin-top:1px}

.cal-h{display:flex;align-items:center;gap:4px;margin-top:20px}
.cal-h h3{flex:1;min-width:0}
.mnav{width:44px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--line2);border-radius:6px}
.mnav[disabled]{color:var(--line2);cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.cal .wd{font-size:10.5px;line-height:14px;color:var(--muted);text-align:center}
.cd{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:40px;padding:3px 4px;border-radius:4px;
  background:var(--raise);font-size:10.5px;line-height:13px;color:var(--muted);overflow:hidden}
.cd.none{background:transparent;border:1px solid var(--line)}
.cd.blank{background:transparent}
.cd.has{color:var(--fg)}
.cd .u{font:600 11px/13px var(--num);color:var(--fg);white-space:nowrap}
.cd.even{background:var(--raise);border:1px solid var(--line2)}
.cd.open{border:1px dashed var(--accent)}
.cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.cd.dark,.cd.dark .u{color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11px;line-height:15px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dayd{margin-top:10px}
.filters{display:inline-flex;margin:12px 0 0;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.fbtn{min-height:44px;display:inline-flex;align-items:center}
.fbtn+.fbtn{border-left:1px solid var(--line2)}
.fbtn span{display:inline-flex;align-items:center;height:44px;padding:0 18px;font-size:13.5px;font-weight:600;color:var(--muted)}
.fbtn[aria-pressed="true"] span{background:var(--raise);color:var(--fg)}
.night{margin-top:20px}
.night h3{padding-bottom:6px;border-bottom:1px solid var(--line2)}
.night h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:40px;font:700 16px/20px var(--cond);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:650}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ptag{display:inline-block;font:700 11px/15px var(--cond);letter-spacing:.07em;padding:0 4px;margin-right:6px;border:1px solid var(--warn);border-radius:3px;color:var(--warn);vertical-align:1px}
.ptag.scr{border-color:var(--line2);color:var(--muted)}
.legs{padding:0 0 0 12px;border-left:1px solid var(--line2);margin:0 0 4px 20px}
.legs .ent{min-height:0}

.lab{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lab h3{font:400 16px/22px var(--head);margin:0}
.lab .rl{font-size:13px;line-height:19px;color:var(--fg2);margin-top:4px}
.lab .nums{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:10px;font:600 21px/28px var(--num)}
.lab .prog{position:relative;height:4px;margin-top:8px;background:var(--line);border-radius:2px;overflow:hidden}
.lab .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.lab .sm{font-size:12px;line-height:17px;color:var(--muted);margin-top:4px}

.svc-h{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:12px 0 6px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-weight:650}
.svc-h.bad{border-left-color:var(--primary);background:var(--selected-bg)}
.svc-h .ic{display:flex;color:var(--accent)} .svc-h.bad .ic{color:var(--primary)}

.kv .k{color:var(--muted);font-size:12.5px;display:flex;align-items:baseline;gap:6px}
.kv .k i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);transform:translateY(-1px)}
.kv .k i.bad{background:var(--primary)} .kv .k i.na{background:var(--line2)}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv .v.bad{color:var(--selected-text)}
.rules{margin:10px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere;color:var(--fg2)}
.rules li::marker{color:var(--muted);font:700 14px var(--cond)}
.slot{font-weight:650;color:var(--fg);white-space:nowrap}
.slot.miss{color:var(--warn)}
.plain{margin:10px 0 0;padding:0 0 0 18px;font-size:13.5px;line-height:20px;color:var(--fg2)}
.plain li{margin:0 0 6px}
.fixed{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;line-height:19px;font-weight:600;color:var(--fg)}
