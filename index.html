<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Check NBA">
<title>Prop Check NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b1118; --surface:#121b25; --raise:#18232f; --line:#22303f;
  --fg:#e7eef5; --muted:#8a9bad; --accent:#6cc4f0; --good:#6fcf97; --warn:#f0b95c; --bad:#f0897a;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;
  font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding:var(--sat) 16px calc(52px + var(--sab) + 24px)}
.mu{color:var(--muted)}

/* header */
.hdr{display:flex;align-items:center;gap:8px;min-height:48px}
.hdr h1{font:600 22px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.ibtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-right:-10px;color:var(--muted)}
.tag-test{font-size:11px;line-height:16px;padding:0 8px;border-bottom:1px dashed var(--warn);color:var(--warn);text-align:center}

/* record strip + status */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 0}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .grow{font:600 19px/22px var(--display);letter-spacing:.01em}
.strip .lbl{font:400 12px/16px var(--body);color:var(--muted);margin-right:8px;letter-spacing:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.status{margin-top:8px;font-size:12px;line-height:17px;color:var(--muted)}
.status div+div{margin-top:1px}
.status .warn{color:var(--warn);font-weight:500} .status .bad{color:var(--bad);font-weight:500}

/* banners */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:10px;border-radius:10px;border:1px solid var(--warn);
  background:rgba(240,185,92,.08);font-size:14px;line-height:20px}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-color:var(--bad);background:rgba(240,137,122,.08)} .banner.stop .ic{color:var(--bad)}
.banner.info{border-color:var(--line);background:var(--surface)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:500;color:var(--fg)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere}
.linkbtn{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* sections */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.sec-h h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0;flex:1}
.sec-h .mu{font-size:12px;line-height:16px;white-space:nowrap}
.stack>*+*{margin-top:8px}

/* pick cards */
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:hidden}
.card[role=button]{cursor:pointer}
.card[aria-expanded="true"]{border-color:#35485c}
.r1{display:flex;align-items:center;gap:8px;min-height:22px}
.rank{font:600 18px/22px var(--display);color:var(--accent);flex:none;min-width:12px}
.meta{font-size:13px;line-height:18px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.own{color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;font-weight:600;letter-spacing:.02em}
.soon{flex:none;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.soon.hot{color:var(--accent);font-weight:500}
.name{font:600 18px/22px var(--display);letter-spacing:.01em;margin-top:4px;overflow-wrap:anywhere}
.r2{display:flex;align-items:flex-end;gap:8px}
.bet{font:600 26px/28px var(--display);letter-spacing:.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.price{font:600 30px/30px var(--display);text-align:right;flex:none;white-space:nowrap}
.betat{font-size:13px;line-height:18px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.betat b{color:var(--fg);font-weight:500}
.chance{font-size:13px;line-height:18px;margin-top:8px}
.chance b{font-weight:500}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(108,196,240,.38)}
.bar i.over{background:var(--accent);border-radius:0 3px 3px 0}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px}
.reason{font-size:14px;line-height:20px;margin-top:8px;overflow-wrap:anywhere}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.betlink{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;margin-top:10px;border-radius:8px;background:var(--accent);
  color:#06202e;font-weight:600;font-size:15px;text-decoration:none}
.betlink:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;line-height:16px;
  background:var(--raise);border:1px solid var(--line);color:var(--fg);max-width:100%;white-space:nowrap}
.chip svg{flex:none}
.chip.ok{color:var(--good);border-color:rgba(111,207,151,.45)}
.chip.early{color:var(--warn);border-color:rgba(240,185,92,.45)}
.chip.lock{color:var(--muted)}
.chip.hollow{background:none;border-color:var(--muted);padding:0 9px}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px}
.more>div+div{margin-top:4px}
.more .k{color:var(--muted)}
.note{font-size:12px;line-height:17px;color:var(--muted);margin-top:8px}
.result{display:flex;align-items:baseline;gap:2px;margin:0 0 6px;font-size:14px;line-height:20px;flex-wrap:wrap}
.result .tg{font:600 18px/20px var(--display);letter-spacing:.03em}

/* pulled */
.pullbar{display:flex;gap:8px;align-items:flex-start;margin:-10px -12px 10px;padding:9px 12px;background:var(--raise);
  border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.pullbar .ic{flex:none;display:flex;color:var(--bad);margin-top:1px}
.pullbar b{font-weight:500;letter-spacing:.04em}
.pullbar .why{overflow-wrap:anywhere}
.ifbet{font-size:15px;line-height:21px;font-weight:500;margin:0 0 8px;overflow-wrap:anywhere}
.dim{opacity:.6}
.dim .meta,.dim .note,.dim .mu,.dim .soon{color:var(--fg)}
.dim .bet{font-size:21px;line-height:24px}
.strike{text-decoration:line-through;text-decoration-thickness:2px}
.shownat{flex:none;text-align:right;font-size:12px;line-height:16px;white-space:nowrap}
.shownat span{font:600 20px/22px var(--display)}

/* games */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.list .li{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px;min-height:44px}
.list .li:last-child{border-bottom:0}
.list .li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.list .li .nm{font:600 17px/20px var(--display);letter-spacing:.01em}
.list .li .nm .mu{font:400 13px/18px var(--body)}
.list .li .r{flex:none;white-space:nowrap;color:var(--muted);text-align:right}
.list .li .r b{font:600 16px/20px var(--display);color:var(--fg)}
.list .st{display:block;font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.list .st .ok{color:var(--good)}
.live{display:inline-block;font:600 12px/16px var(--display);letter-spacing:.06em;padding:0 5px;border-radius:3px;background:var(--bad);color:#2a0d08}
.fin{font:600 13px/16px var(--display);letter-spacing:.05em;color:var(--muted)}

/* empty + skeleton */
.empty .t{font-size:16px;line-height:23px;font-weight:500}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.skel{height:150px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
.skel.sm{height:20px;width:60%;border-radius:6px}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;
  border:1px solid var(--accent);color:var(--accent);font-weight:500;font-size:14px}
.btn.wide{width:100%}

/* footer */
.foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs .in{max-width:520px;margin:0 auto;display:flex;height:52px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;color:var(--muted);
  font:600 18px/22px var(--display);letter-spacing:.03em;position:relative;text-align:center}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* record */
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.hl>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.hl .k{font-size:11px;line-height:15px;color:var(--muted)}
.hl .v{font:600 30px/34px var(--display);white-space:nowrap}
.hl .s{font-size:11px;line-height:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:6px}
.tbl{margin-top:14px;font-size:13px;line-height:18px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 46px 40px 44px 52px;column-gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:11px;line-height:15px;color:var(--muted);padding:0 0 4px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .num{font:600 16px/18px var(--display)}
.tr .lbl small{display:block;font-size:11px;line-height:15px;color:var(--muted)}
.night{margin-top:18px}
.night h3{font:600 17px/22px var(--display);letter-spacing:.02em;margin:0 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.night h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:44px;font:600 15px/20px var(--display);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:500}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ent .u{flex:none;font:600 15px/20px var(--display);white-space:nowrap;text-align:right;min-width:46px}
.ptag{display:inline-block;font:600 12px/16px var(--display);letter-spacing:.05em;padding:0 5px;margin-right:6px;border:1px solid var(--muted);border-radius:3px;color:var(--fg);vertical-align:1px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(3,7,11,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0}
.sheet-h .ibtn{margin:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + var(--sab));overscroll-behavior:contain}
.fixed{padding:10px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line);font-size:13px;line-height:19px;font-weight:500}
.rules{margin:12px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere}
.rules li::marker{color:var(--muted);font-family:var(--display);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="hdr"><h1>Prop Check NBA</h1></div>
  <p class="mu" style="font-size:13px;margin:4px 0 14px">Loading tonight's picks</p>
  <div class="stack"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>
<nav id="tabs" class="tabs" aria-label="Views"></nav>
<div id="sheetroot"></div>
<noscript><p style="padding:16px">Prop Check NBA needs JavaScript turned on to show tonight's picks.</p></noscript>

<script>

/* ---------- setup ---------- */

var TZ = 'America/New_York';
var STALE_MIN = 30, REFRESH_DEF = 120;
var MARKET_LINE = 'Prices: Hard Rock only · No leg worse than -200 · Rebounds main line only';

  slate: null, record: null, rules: null, recordErr: null,

  older: [], olderIdx: 0, olderBusy: false, olderErr: false,

var tabsEl = document.getElementById('tabs');
var sheetRoot = document.getElementById('sheetroot');

};

  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size || 16); s.setAttribute('height', size || 16);

/* ---------- formatting (always Eastern) ---------- */

function tidy(s) { return s.replace(/[  ]/g, ' '); }

function dayKey(t) { var p = parts(t); return p.year + ' ' + p.month + ' ' + p.day; }
var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function plainDate(s) { /* "2026-10-25" with no clock: never shifted by a time zone */
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s)); if (!m) return null;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));

    if (emp && emp.text) { t = str(emp.text); why = emp.why ? str(emp.why) : null; nx = fStamp(emp.next); }
    else if (d.started.length) t = "No open picks right now. Tonight's earlier picks are under Started.";
    else if (d.pulled.length) t = 'No open picks right now.';
    else t = 'No picks posted.';
    if (!nx && !(emp && emp.text) && fStamp(isObj(sl.status) ? sl.status.next_read_at : null)) nx = fStamp(sl.status.next_read_at);
    sec.appendChild(h('div', { class: 'card empty' }, h('div', { class: 't', text: t }),
      why ? h('div', { class: 's', text: why }) : null,
      nx ? h('div', { class: 's', text: 'Next check ' + nx }) : null));
  } else {
    var stack = h('div', { class: 'stack' });
    d.open.forEach(function (p) { stack.appendChild(pickCard(p, d)); });
    sec.appendChild(stack);
  }
  app.appendChild(sec);

  if (d.started.length) {
    var sx = h('div', { class: 'stack' });
    d.started.forEach(function (p) { sx.appendChild(pickCard(p, d, { started: true })); });
    app.appendChild(h('section', { class: 'sec', id: 'started' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Started (' + d.started.length + ')' })), sx));
  }
  if (d.pulled.length) {
    var px = h('div', { class: 'stack' });
    d.pulled.forEach(function (p) { px.appendChild(pulledCard(p, d)); });
    app.appendChild(h('section', { class: 'sec', id: 'pulled' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Pulled (' + d.pulled.length + ')' })), px));
  }

  /* Games */
  var games = arr(sl.games).filter(isObj).slice().sort(function (a, b) { return (ms(a.start) || 0) - (ms(b.start) || 0); });
  if (games.length) {
    var gl = h('div', { class: 'list' });
    games.forEach(function (g) { gl.appendChild(gameRow(g)); });
    app.appendChild(h('section', { class: 'sec', id: 'games' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Games (' + games.length + ')' })), gl));
  }
  app.appendChild(footer());
}
function gameRow(g) {
  var n = num(g.picks), right;
  if (g.state === 'in') right = h('span', { class: 'r' }, h('span', { class: 'live', text: 'LIVE' }), g.detail ? h('span', { style: 'display:block;font-size:12px', text: str(g.detail) }) : null);
  else if (g.state === 'post') right = h('span', { class: 'r' }, h('span', { class: 'fin', text: 'FINAL' }));
  else right = h('span', { class: 'r' }, n ? h('b', { text: n }) : null, n ? (n === 1 ? ' pick' : ' picks') : 'no picks');
  if ((g.state === 'in' || g.state === 'post') && n) right.appendChild(h('span', { style: 'display:block;font-size:12px', text: n + (n === 1 ? ' pick' : ' picks') }));
  var lx = isObj(g.lineups) ? g.lineups : {}, sub = null;
  if (g.state !== 'in' && g.state !== 'post') {
    var side = function (ab, k) {
      return lx[k] === 'confirmed' ? [str(ab) + ' ', h('span', { class: 'ok', text: '✅ starters' })] : [str(ab) + ' expected'];
    };
    sub = h('span', { class: 'st' }, side(g.away, 'away'), ' · ', side(g.home, 'home'));
  }
  return h('div', { class: 'li' }, h('span', { class: 'grow' },
    h('span', { class: 'nm' }, str(g.away) + ' @ ' + str(g.home), h('span', { class: 'mu', text: ' · ' + (fTime(g.start) || str(g.detail) || 'time not posted') })),
    sub), right);
}
function footer() {
  var v = S.rules ? S.rules.version : null;
  return h('footer', { class: 'foot' },
    h('button', { class: 'linkbtn', type: 'button', on: { click: function () { openSheet(); } } }, 'How picks are made'),
    h('p', { text: (v != null ? 'Rules v' + v + '. ' : '') + 'All times Eastern. Checks for updates every ' + Math.round(refreshSec() / 60) + ' min while open.' }),
    h('p', { text: 'For adults 21+. Picks are estimates, not guarantees. Bet only what you can afford to lose. Gambling problem? Call 1-888-ADMIT-IT.' }));
}

/* ---------- Record ---------- */
function renderRecord() {
  app.appendChild(header('The Record', null));
  if (!S.loaded) { app.appendChild(h('div', { class: 'stack' }, h('div', { class: 'skel sm' }), h('div', { class: 'skel' }))); return; }
  if (!S.record) {
    app.appendChild(h('div', { class: 'card empty', style: 'margin-top:12px' },
      h('div', { class: 't', text: S.recordErr === 'file' ? "The Record file couldn't be read. Trying again." : "Can't load the Record. Check your connection." }),
      h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', type: 'button', text: 'Try again', on: { click: function () { load().then(render); } } }))));
    app.appendChild(footer()); return;
  }
  var sum = isObj(S.record.summary) ? S.record.summary : {}, hd = isObj(sum.headline) ? sum.headline : {};
  var w = num(hd.w) || 0, l = num(hd.l) || 0, n = num(hd.n) != null ? hd.n : w + l;
  if (!(w + l + (num(hd.push) || 0) + (num(hd.void) || 0))) {
    app.appendChild(h('div', { class: 'card empty', style: 'margin-top:8px' },
      h('div', { class: 't', text: 'No graded picks yet.' }), h('div', { class: 's', text: 'Results post once each game is final.' })));
  } else {
    var hr = pctNear(hd.hit_rate), nd = pctNear(hd.needed);
    app.appendChild(h('div', { class: 'hl', role: 'table', 'aria-label': 'Record' },
      h('div', { role: 'row' }, h('div', { class: 'k', text: 'W-L' }), h('div', { class: 'v', text: w + '-' + l }),
        h('div', { class: 's', text: [num(hd.push) ? hd.push + ' push' : '', num(hd.void) ? hd.void + ' void' : ''].filter(Boolean).join(' · ') || n + ' graded' })),
      h('div', { role: 'row' }, h('div', { class: 'k', text: 'Units' }), h('div', { class: 'v ' + signCls(hd.units), text: units(hd.units, 2) || '0.00u' }),
        h('div', { class: 's', text: '1 unit each' })),
      h('div', { role: 'row' }, h('div', { class: 'k', text: 'Hit rate' }), h('div', { class: 'v' + (num(hd.hit_rate) != null && num(hd.needed) != null ? (hd.hit_rate >= hd.needed ? ' pos' : ' neg') : ''), text: hr || '—' }),
        h('div', { class: 's', text: nd ? 'needed ' + nd : 'needed —' }))));
    var bar = chanceBar(hd.hit_rate, hd.needed); if (bar) { bar.style.marginTop = '10px'; app.appendChild(bar); }
    app.appendChild(h('div', { class: 'subline', text: n + ' graded picks, at the posted Hard Rock price. Pulled picks are not counted here.' }));

    var rows = arr(sum.rows).filter(function (r) { return isObj(r) && ((num(r.w) || 0) + (num(r.l) || 0) + (num(r.push) || 0) + (num(r.void) || 0)) > 0; });
    if (rows.length) {
      var tbl = h('div', { class: 'tbl', role: 'table', 'aria-label': 'Record by market' });
      tbl.appendChild(h('div', { class: 'tr th', role: 'row' }, h('span', { text: '' }), h('span', { text: 'W-L' }), h('span', { text: 'Hit' }),
        h('span', { text: 'Needed' }), h('span', { text: 'Units' })));
      rows.forEach(function (r) {
        var lab = r.key === 'pulled' ? h('span', { class: 'lbl' }, 'Pulled', h('small', { text: '(not counted above)' }))
          : h('span', { class: 'lbl', text: r.label || str(r.key) || 'Other' });
        var u = num(r.units);
        tbl.appendChild(h('div', { class: 'tr', role: 'row' }, lab, h('span', { class: 'num', text: (num(r.w) || 0) + '-' + (num(r.l) || 0) }),
          h('span', { text: pctNear(r.hit_rate) || '—' }), h('span', { text: pctNear(r.needed) || '—' }),
          h('span', { class: 'num ' + signCls(u), text: u == null ? '—' : (units(u, 2) || '').replace(/u$/, '') })));
      });
      app.appendChild(tbl);
    }
    app.appendChild(h('p', { class: 'note', text: 'Push and void are 0 units and left out of hit rate. Nothing on the Record is ever edited or removed.' }));
  }

  var seen = {}, nights = [];
  arr(S.record.nights).concat(S.older).forEach(function (nt) { if (isObj(nt) && !seen[nt.date]) { seen[nt.date] = 1; nights.push(nt); } });
  nights.sort(function (a, b) { return str(a.date) < str(b.date) ? 1 : (str(a.date) > str(b.date) ? -1 : 0); });
  var shown = 0;
  nights.forEach(function (nt) {
    var ents = arr(nt.entries).filter(isObj); if (!ents.length) return;
    shown++;
    var wl = (num(nt.w) || 0) + (num(nt.l) || 0), tail = null;
    if (wl || nt.graded) tail = (num(nt.w) || 0) + '-' + (num(nt.l) || 0) + (units(nt.units, 2) ? ' · ' + units(nt.units, 2) : '') + (nt.graded ? '' : ' so far');
    var sec = h('section', { class: 'night' }, h('h3', null, fDateLong(nt.date) + (tail ? ' · ' + tail : ''),
      nt.graded ? null : h('span', { class: 'mu', text: ' · results post when games end' })));
    ents.forEach(function (e) { sec.appendChild(entryRow(e)); });
    app.appendChild(sec);
  });
  if (!shown) app.appendChild(h('p', { class: 'mu', style: 'margin-top:16px', text: 'No nights on the Record yet.' }));

  var older = arr(S.record.older);
  if (S.olderIdx < older.length) {
    app.appendChild(h('button', { class: 'btn wide', type: 'button', style: 'margin-top:18px', text: S.olderBusy ? 'Loading' : 'Load older months', on: { click: loadOlder } }));
    if (S.olderErr) app.appendChild(h('p', { class: 'note', style: 'color:var(--warn)', text: "Couldn't load older months. Try again." }));
  }
  app.appendChild(footer());
}
function entryRow(e) {
  var res = e.result == null ? null : str(e.result), known = { W: 1, L: 1, PUSH: 1, VOID: 1 };
  var tag = h('span', { class: 'tg ' + (res && known[res] ? res : 'none'), text: res || '–' });
  if (!res) tag.setAttribute('aria-label', 'Awaiting result');
  var l2 = [odds(e.price)];
  if (e.game) l2.push(str(e.game));
  if (e.pulled) l2.push('pulled' + (fTime(e.pulled.at) ? ' ' + fTime(e.pulled.at) : '') + (e.pulled.reason ? ': ' + str(e.pulled.reason) : ''));
  if (!res) l2.push('awaiting result'); else if (e.actual) l2.push(str(e.actual));
  var u = res ? units(e.units, 2) : null;
  return h('div', { class: 'ent' }, tag,
    h('div', { class: 'bd' }, h('div', { class: 'e1' }, e.pulled ? h('span', { class: 'ptag', text: 'PULLED' }) : null,
      h('span', { class: 'pn', text: e.player || 'Player not named' }), ' ' + str(e.bet)), h('div', { class: 'e2', text: l2.join(' · ') })),
    u ? h('span', { class: 'u ' + signCls(e.units), text: u }) : null);
}
function loadOlder() {
  if (S.olderBusy || !S.record) return;
  var list = arr(S.record.older), path = list[S.olderIdx]; if (!path) return;
  path = str(path).replace(/^\/+/, '').replace(/\.\.\//g, '');
  S.olderBusy = true; S.olderErr = false; render();
  getJSON(BASE + path).then(function (j) {
    S.olderBusy = false; S.olderIdx++; S.older = S.older.concat(arr(j.nights)); render();
  }, function () { S.olderBusy = false; S.olderErr = true; render(); });
}

/* ---------- tabs + routing ---------- */
function renderTabs() {
  clear(tabsEl);
  var mk = function (v, label) {
    return h('button', { class: 'tab', type: 'button', 'aria-current': S.view === v ? 'page' : null, text: label, on: { click: function () { go(v); } } });
  };
  tabsEl.appendChild(h('div', { class: 'in' }, mk('tonight', 'Tonight'), mk('record', 'Record')));
}
function viewFromHash() { return location.hash === '#record' ? 'record' : 'tonight'; }
function go(v) {
  if (v === S.view) { window.scrollTo(0, 0); return; }
  try { history.pushState(null, '', location.pathname + location.search + (v === 'record' ? '#record' : '')); }
  catch (e) { location.hash = v === 'record' ? '#record' : ''; }
  route();
}
function route() {
  var v = viewFromHash();
  if (v !== S.view) { S.scroll[S.view] = window.scrollY || 0; S.view = v; render(); window.scrollTo(0, S.scroll[v] || 0); }
}

/* ---------- rules sheet ---------- */
function openSheet() {
  S.sheetFocus = document.activeElement; S.sheet = 'rules';
  try { history.pushState({ sheet: 'rules' }, '', location.href); } catch (e) { /* ignore */ }
  fillSheet();
  var c = sheetRoot.querySelector('.ibtn'); if (c) c.focus();
}
function closeSheet(fromPop) {
  if (!S.sheet) return;
  if (!fromPop && history.state && history.state.sheet) { history.back(); return; }
  S.sheet = null; clear(sheetRoot); document.body.style.overflow = '';
  if (S.sheetFocus && document.contains(S.sheetFocus) && S.sheetFocus.focus) S.sheetFocus.focus();
}
function fillSheet() {
  var prev = 0, old = sheetRoot.querySelector('.sheet-b'); if (old) prev = old.scrollTop;
  clear(sheetRoot);
  var body = h('div', { class: 'sheet-b' });
  var v = S.rules ? S.rules.version : null, up = S.rules ? S.rules.updated : null;
  body.appendChild(h('div', { class: 'mu', style: 'font-size:12px;margin-bottom:8px', text: (v != null ? 'Rules v' + v : 'Rules') + (up ? ' · changed ' + fDateShort(up) : '') }));
  body.appendChild(h('div', { class: 'fixed', text: MARKET_LINE }));
  var lines = S.rules ? arr(S.rules.lines).map(str).filter(Boolean) : [];
  if (lines.length) {
    var ol = h('ol', { class: 'rules' });
    lines.forEach(function (s) { ol.appendChild(h('li', { text: s })); });
    body.appendChild(ol);
  } else body.appendChild(h('p', { style: 'color:var(--warn)', text: S.rules ? 'No rules posted yet.' : "The rules didn't load. Trying again." }));
  body.appendChild(h('p', { class: 'note', text: 'All times Eastern. Picks are estimates, not guarantees.' }));
  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'How picks are made' },
    h('div', { class: 'sheet-h' }, h('h2', { text: 'How picks are made' }),
      h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close', on: { click: function () { closeSheet(false); } } }, icon('close', 22))), body);
  var scrim = h('div', { class: 'scrim', on: { click: function (e) { if (e.target === scrim) closeSheet(false); } } }, sheet);
  sheetRoot.appendChild(scrim); document.body.style.overflow = 'hidden'; body.scrollTop = prev;
}

/* ---------- wiring ---------- */
window.addEventListener('popstate', function () { if (S.sheet) closeSheet(true); route(); });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(false); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) load().then(schedule); });
setInterval(function () { if (S.loaded && !document.hidden) maybeRender(); }, 30000);  /* "starts in" and stale checks tick on */

S.view = viewFromHash();
renderTabs();
load().then(schedule);
})();
</script>
</body>
</html>
