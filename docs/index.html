<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop Check NBA</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1e2229;--line:#2a2f37;--tx:#e8eaed;--mut:#9aa1ab;--acc:#4cc38a;--warn:#f0b429;--bad:#ef5d5d;--blue:#6ea8fe}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:190px}
header{padding:14px 16px 6px}
h1{font-size:18px;margin:0}
.meta{color:var(--mut);font-size:12.5px;margin-top:2px}
.alert{margin:8px 16px;padding:8px 10px;border-radius:8px;background:#3a2e10;color:#ffd77a;font-size:13px}
.note{margin:6px 16px;color:var(--mut);font-size:12.5px}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
nav button.on{background:var(--acc);color:#04130b;border-color:var(--acc);font-weight:600}
.game{margin:12px 16px 4px}
.gh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;gap:8px}
.gh small{color:var(--mut);font-weight:400;font-size:12px;text-align:right}
.gnote{color:var(--warn);font-size:12.5px;margin:2px 0}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer}
.who{flex:1;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--mut);font-size:12.5px}
.fair{text-align:right}
.fair b{font-size:17px;display:block}
.fair span{font-size:11.5px;color:var(--mut)}
.det{display:none;padding:0 10px 10px;border-top:1px solid var(--line);font-size:13px}
.p.open .det{display:block}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
td.ln{font-weight:600;text-align:left}
tr.f td.ln{color:var(--acc)}
td.c{cursor:pointer}
td.c b{display:block;font-size:14px}
td.c span{color:var(--mut);font-size:11.5px}
td.c.on{background:var(--acc);color:#04130b}td.c.on span{color:#04130b}
td.c.good b{color:var(--acc)}
td.c.on.good b{color:#04130b}
td.blk{color:#5d636c;font-size:11.5px}
.kv{color:var(--mut);margin-top:6px}
.kv b{color:var(--tx);font-weight:500}
.held{margin-top:6px;color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);margin:20px 16px}
.hint{margin:4px 16px 0;color:var(--mut);font-size:12px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#12151a;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;z-index:9}
#bar.show{display:block}
#bar .legs{font-size:12.5px;color:var(--mut);padding-right:50px}
#bar .big{display:flex;justify-content:space-between;margin-top:6px}
#bar .big div{text-align:center;flex:1}
#bar .big b{display:block;font-size:17px}
#bar .big span{font-size:11.5px;color:var(--mut)}
.w{color:var(--warn);font-size:12.5px;margin-top:4px}
.clr{float:right;background:none;border:0;color:var(--blue);font-size:13px}
.over{color:var(--acc)}.under{color:var(--blue)}.void{color:var(--mut)}
.sec{margin:14px 16px 4px;font-weight:600}
.chk{margin-top:10px;padding:8px;background:var(--card2);border-radius:8px}
.chk .t{font-size:12px;color:var(--mut);margin-bottom:6px}
.ins{display:flex;gap:6px;align-items:flex-end}
.ins label{flex:1;font-size:11px;color:var(--mut)}
.ins .pr{display:flex}
.ins input{width:100%;min-width:0;padding:8px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--tx);font-size:16px}
.sg{padding:0 8px;border:1px solid var(--line);border-right:0;border-radius:6px 0 0 6px;background:var(--card);color:var(--tx);font-size:16px}
.pr input{border-radius:0 6px 6px 0}
.vd{margin-top:8px;font-size:13px}
.vd div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);gap:8px}
.vd .tag{font-weight:700;padding:3px 8px;border-radius:5px;font-size:12.5px;white-space:nowrap}
.tag.bet{background:var(--acc);color:#04130b}.tag.pass{background:#2d323a;color:var(--mut)}.tag.blk{background:#3a2020;color:#ff9b9b}
.vd .add2{background:none;border:1px solid var(--line);color:var(--blue);border-radius:5px;padding:3px 6px;font-size:12px}
.news{color:var(--warn);font-size:12.5px;margin-top:6px}
.pad{margin:0 16px}
.pad td,.pad th{text-align:right}.pad td:first-child,.pad th:first-child{text-align:left}
</style>
</head>
<body>
<header><h1>Prop Check NBA</h1><div class="meta" id="meta">Loading…</div></header>
<div id="alerts"></div>
<nav><button data-t="slate" class="on">Tonight</button><button data-t="record">Record</button></nav>
<main id="main"></main>
<div id="bar"></div>
<script>
const $ = s => document.querySelector(s);
const NEED = 0.574;  // tool % needed to bet at -110 with the 5-pt cushion (backtest table)
let S = null, R = null, tab = 'slate', pick = [];
const tpct = p => Math.floor(p * 100 + 1e-9) + '%';   // round down so 57.3 never reads as 58
const am = a => a > 0 ? '+' + a : '' + a;
const dec = a => 1 + (a > 0 ? a / 100 : 100 / -a);
const toAm = d => d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
const probAm = p => { p = Math.min(Math.max(p, .01), .99); return p >= .5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p) };
const cushion = p => p < .5 ? .04 : p < .65 ? .05 : p < .75 ? .06 : p < .85 ? .07 : .08;
const betAt = p => probAm(p - cushion(p));
const nyDate = () => new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
const fmtLine = l => l.toFixed(1);

function probs(p, line) {
  const i = S.lines.indexOf(line);
  if (i < 0) return null;
  const over = p.over[i];
  return {over: Math.min(over, .85), under: Math.min(1 - over, .85)};
}
const blocked = (side, line) => side === 'over' ? line >= S.block_over_at : line <= S.block_under_at;

// ---------- check a line (nothing is saved) ----------
const CK = {};
function checkHTML(p) {
  const c = CK[p.espn_id] || (CK[p.espn_id] = {line: '', op: '', up: '', os: '-', us: '-'});
  const e = p.espn_id;
  return `<div class="chk" onclick="event.stopPropagation()"><div class="t">Check Hard Rock's line</div>
   <div class="ins">
    <label>Line<input inputmode="decimal" value="${c.line}" placeholder="${fmtLine(p.fair)}" oninput="ck('${e}','line',this.value)"></label>
    <label>Over price<div class="pr"><button class="sg" onclick="sg('${e}','os',this)">${c.os === '-' ? '−' : '+'}</button><input inputmode="numeric" value="${c.op}" placeholder="110" oninput="ck('${e}','op',this.value)"></div></label>
    <label>Under price<div class="pr"><button class="sg" onclick="sg('${e}','us',this)">${c.us === '-' ? '−' : '+'}</button><input inputmode="numeric" value="${c.up}" placeholder="110" oninput="ck('${e}','up',this.value)"></div></label>
   </div><div class="vd" id="V${e}">${verdictHTML(p)}</div></div>`;
}
function ck(e, k, v) { CK[e][k] = v; upd(e); }
function sg(e, k, btn) { CK[e][k] = CK[e][k] === '-' ? '+' : '-'; btn.textContent = CK[e][k] === '-' ? '−' : '+'; upd(e); }
function findP(e) { for (const g of S.games) for (const p of g.players) if (p.espn_id === e) return [p, g]; return [null, null]; }
function upd(e) { const [p] = findP(e); const v = document.getElementById('V' + e); if (p && v) v.innerHTML = verdictHTML(p); }
const implied = a => a < 0 ? -a / (-a + 100) : 100 / (a + 100);
function sideProb(p, side, line) {
  // whole-number line: over needs line+1, under needs line-1 (push ignored, slightly conservative)
  const key = Number.isInteger(line) ? (side === 'over' ? line + 0.5 : line - 0.5) : line;
  const pr = probs(p, key);
  return pr ? pr[side] : null;
}
function verdictHTML(p) {
  const c = CK[p.espn_id], line = parseFloat(c.line);
  if (!(line >= 0)) return '<div style="border:0;color:var(--mut)">Enter the line and at least one price.</div>';
  let h = '';
  for (const [side, pk, sk] of [['over', 'op', 'os'], ['under', 'up', 'us']]) {
    const raw = parseInt(c[pk]);
    if (!(raw >= 100)) continue;
    const price = c[sk] === '-' ? -raw : raw, pr = sideProb(p, side, line);
    const lab = `${side === 'over' ? 'Over' : 'Under'} ${c.line} ${am(price)}`;
    if (pr == null) { h += `<div><span>${lab}</span><span class="tag pass">No data</span></div>`; continue; }
    if (blocked(side, Number.isInteger(line) ? line + (side === 'over' ? .5 : -.5) : line)) {
      h += `<div><span>${lab}<br><small style="color:var(--mut)">Backtest: tool runs hot here</small></span><span class="tag blk">BLOCKED</span></div>`; continue;
    }
    const need = implied(price) + cushion(pr), bet = pr - cushion(pr) >= implied(price);
    const id = `${p.espn_id}|${side}|${Number.isInteger(line) ? (side === 'over' ? line + .5 : line - .5) : line}`;
    h += `<div><span>${lab}<br><small style="color:var(--mut)">Tool ${tpct(pr)} · need ${tpct(need)} · bet at ${am(betAt(pr))} or better</small></span>
      <span>${bet ? `<button class="add2" onclick="tog('${id}')">+ parlay</button> ` : ''}<span class="tag ${bet ? 'bet' : 'pass'}">${bet ? 'BET' : 'PASS'}</span></span></div>`;
  }
  if (!h) h = '<div style="border:0;color:var(--mut)">Add a price (e.g. 110 with − for -110).</div>';
  if (Math.abs(line - p.fair) >= 3) h += `<div class="news" style="border:0">Check news: Hard Rock is ${Math.abs(line - p.fair).toFixed(1)} pts off our fair line (${fmtLine(p.fair)}). That's usually injury or role news we can't see.</div>`;
  return h;
}

async function load() {
  try { S = await (await fetch('slate.json?' + Date.now())).json(); } catch (e) { S = null; }
  try { R = await (await fetch('record.json?' + Date.now())).json(); } catch (e) { R = null; }
  render();
}

function header() {
  if (!S) { $('#meta').textContent = 'No slate data found.'; return; }
  const g = new Date(S.generated_et), hrs = (Date.now() - g.getTime()) / 36e5;
  $('#meta').textContent = `${S.date} · ${S.run} run · ${g.toLocaleTimeString('en-US', {timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit'})} ET · ${S.n_players} players`;
  let a = '';
  if (S.date !== nyDate()) a += `<div class="alert">This slate is from ${S.date}, not today. Today's hasn't run yet.</div>`;
  else if (hrs > 5) a += `<div class="alert">Data is ${Math.floor(hrs)} hours old. Injury news may have changed.</div>`;
  $('#alerts').innerHTML = a + S.notes.map(n => `<div class="note">${n}</div>`).join('');
}

function cell(p, g, side, line, pr) {
  if (blocked(side, line)) return `<td class="blk">—</td>`;
  const id = `${p.espn_id}|${side}|${line}`, on = pick.some(x => x.id === id);
  return `<td class="c ${on ? 'on' : ''} ${pr >= NEED ? 'good' : ''}" onclick="tog('${id}')"><b>${tpct(pr)}</b><span>${am(betAt(pr))}</span></td>`;
}

function playerHTML(p, g) {
  let rows = '';
  for (let d = -3; d <= 3; d++) {
    const line = p.fair + d, pr = probs(p, line);
    if (!pr || line < 0) continue;
    rows += `<tr class="${d === 0 ? 'f' : ''}"><td class="ln">${fmtLine(line)}</td>${cell(p, g, 'over', line, pr.over)}${cell(p, g, 'under', line, pr.under)}</tr>`;
  }
  const st = p.strip;
  return `<div class="p" id="P${p.espn_id}">
   <div class="row" onclick="this.parentNode.classList.toggle('open')">
    <div class="who"><b>${p.player}</b><span>${p.team} · ${p.l5min} min L5${p.status ? ' · ' + p.status : ''}</span></div>
    <div class="fair"><b>${fmtLine(p.fair)}</b><span>fair line</span></div>
   </div>
   <div class="det">
    ${checkHTML(p)}
    <table><tr><th style="text-align:left">Line</th><th>Over · bet at</th><th>Under · bet at</th></tr>${rows}</table>
    <div class="kv">Green = 57%+ (beats -110 after cushion). — = blocked (backtest: runs hot).</div>
    <div class="kv">Over ${fmtLine(p.fair)}: L5 <b>${tpct(st.L5)}</b> · L10 <b>${tpct(st.L10)}</b> · L20 <b>${tpct(st.L20)}</b> · Season <b>${tpct(st.S)}</b></div>
    <div class="kv">Last 10: <b>${p.last10.join(', ')}</b></div>
    <div class="kv">vs ${p.opp} (shown, not counted): <b>${p.h2h.length ? p.h2h.join(', ') : 'none'}</b></div>
    <div class="kv">Factor ${p.factor} (opp D ${p.def_ratio}, pace ${p.pace_ratio}${p.opp_b2b ? ', opp B2B' : ''}) · ${p.n_hist} clean games (${p.n_cur} this season${p.k ? ', last-season blend k=' + p.k : ''})${p.matched_last_season ? '' : ' · no last-season match'}</div>
   </div></div>`;
}

function slateHTML() {
  if (!S) return '<div class="empty">No slate yet.</div>';
  let h = '<div class="hint">Tap a player for over/under % by line. Tap a % to add it to a parlay.</div>';
  for (const g of S.games) {
    h += `<div class="game"><div class="gh">${g.game}<small>${g.tip_et}${g.spread != null ? ' · ' + g.spread_txt : ''}${g.settled ? ' · ' + g.settled : ''}</small></div>`;
    if (g.note) h += `<div class="gnote">${g.note}</div>`;
    h += g.players.map(p => playerHTML(p, g)).join('') || (g.note ? '' : '<div class="held">Nobody passes the gates.</div>');
    if (g.held && g.held.length) h += `<div class="held">Held: ${g.held.map(x => `${x.player} (${x.why})`).join('; ')}</div>`;
    h += '</div>';
  }
  return h;
}

function recordHTML() {
  if (!R || !R.rows.length) return '<div class="empty">Nothing logged yet.</div>';
  const g = R.rows.filter(r => r.result === 'over' || r.result === 'under');
  let h = '<div class="sec">Fair line check</div><div class="pad">';
  if (g.length) {
    const ov = g.filter(r => r.result === 'over').length / g.length;
    const mae = g.reduce((a, r) => a + Math.abs(r.pts - r.fair), 0) / g.length;
    h += `<div class="kv">Graded: <b>${g.length}</b> · went over fair line: <b>${Math.round(ov * 100)}%</b> (should be ~50%) · avg miss: <b>${mae.toFixed(1)} pts</b> (backtest 5.8)</div>`;
  } else h += '<div class="kv">Nothing graded yet. Grading runs the next morning.</div>';
  h += '</div><div class="sec">Players</div><div class="pad"><table><tr><th>Player</th><th>Fair</th><th>Pts</th></tr>';
  let d = '';
  for (const r of R.rows) {
    if (r.date !== d) { d = r.date; h += `<tr><td colspan="3" style="color:var(--mut);padding-top:10px">${d}</td></tr>`; }
    h += `<tr><td>${r.player}</td><td>${fmtLine(r.fair)}</td><td class="${r.result}">${r.result ? (r.result === 'void' ? 'void' : r.pts) : '…'}</td></tr>`;
  }
  return h + '</table></div>';
}

function tog(id) {
  const i = pick.findIndex(x => x.id === id);
  if (i >= 0) pick.splice(i, 1);
  else {
    const [eid, side, line] = id.split('|');
    const pi = pick.findIndex(x => x.p.espn_id === eid);
    if (pi >= 0) pick.splice(pi, 1);          // one leg per player
    else if (pick.length >= 3) { flash('Max 3 legs. Remove one first.'); return; }
    for (const g of S.games) for (const p of g.players) if (p.espn_id === eid) {
      const pr = probs(p, +line)[side];
      pick.push({id, p, g, side, line: +line, pr});
    }
  }
  render();
}
function flash(t) { const l = $('#bar .legs'); if (l) l.textContent = t; }

function bar() {
  const b = $('#bar');
  if (!pick.length || tab !== 'slate') { b.className = ''; return; }
  b.className = 'show';
  const p = pick.reduce((a, x) => a * x.pr, 1);
  const d = pick.reduce((a, x) => a * dec(betAt(x.pr)), 1);
  const warn = [];
  if (pick.length < 2) warn.push('Pick 2-3 legs.');
  for (const x of pick) if (x.pr < NEED) warn.push(`${x.p.player} ${x.side} is under 57% (not a bet even at -110).`);
  const games = pick.map(x => x.g.id);
  if (new Set(games).size < games.length) warn.push('SGP: % is rough, Hard Rock reprices same-game.');
  b.innerHTML = `<button class="clr" onclick="pick=[];render()">Clear</button>
   <div class="legs">${pick.map(x => `${x.p.player} ${x.side === 'over' ? 'O' : 'U'} ${fmtLine(x.line)} (${tpct(x.pr)})`).join(' · ')}</div>
   ${pick.length >= 2 ? `<div class="big"><div><b>${tpct(p)}</b><span>combined</span></div><div><b>${am(probAm(p))}</b><span>fair</span></div><div><b>${am(toAm(d))}</b><span>bet parlay at or better</span></div></div>` : ''}
   ${warn.map(w => `<div class="w">${w}</div>`).join('')}`;
}

function render() {
  header();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const open = [...document.querySelectorAll('.p.open')].map(e => e.id);
  $('#main').innerHTML = tab === 'record' ? recordHTML() : slateHTML();
  open.forEach(id => { const e = document.getElementById(id); if (e) e.classList.add('open'); });
  bar();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
load();
</script>
</body>
</html>
