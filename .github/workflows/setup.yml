# One-time setup run: seed last season's and this season's box scores from ESPN, and save samples of every free
# data source (the build sandbox cannot reach them). Started by a push to scripts/seed_probe.py or by hand.
name: setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/seed_probe.py', '.github/workflows/setup.yml']
permissions:
  contents: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/seed_probe.py probe seed
      - run: |
          git config user.name "prop-check-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/seed probe
          git commit -qm "setup: seed box scores and source probe [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
