# One-time CORS check for the Live tab's in-browser polling (probe/cors_probe.sh). Prints to the job log; commits nothing.
name: cors-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/cors_probe.sh', '.github/workflows/cors_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash probe/cors_probe.sh
