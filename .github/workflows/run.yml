name: run
on:
  schedule:
    - cron: "5,35 * * * *"   # checks every 30 min; engine.run auto decides what's due (ET)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | slate"
        default: "auto"
concurrency: { group: run, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m engine.run ${{ github.event.inputs.mode || 'auto' }} ${{ github.event.inputs.mode == 'slate' && 'manual' || '' }} 2>&1 | tee data/last_log.txt
      - name: commit
        run: |
          git config user.name "prop-check-bot" && git config user.email "bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet -- . ':!data/last_log.txt'; then echo "no changes"; exit 0; fi
          git commit -qm "run $(TZ=America/New_York date +%F_%H:%M) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
