# One-time source probe for the Live tab and headshots (probe/live_probe.py). Uploads probe/live as an artifact; commits nothing.
name: live-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/live_probe.py', '.github/workflows/live_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe/live_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-probe
          path: probe/live
