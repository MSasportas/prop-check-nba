# One-time research read of alternate ladders (research/alt_probe.py). Started by a push to that script or by hand.
name: alt-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/alt_probe.py', '.github/workflows/alt_probe.yml']
permissions:
  contents: write
concurrency:
  group: alt-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEYS_2: ${{ secrets.ODDS_API_KEYS_2 }}
        run: python research/alt_probe.py
      - run: |
          git config user.name "prop-check-bot" && git config user.email "bot@users.noreply.github.com"
          git add research/alt_probe
          git commit -qm "research: alt ladder probe [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
