name: data-check
on:
  workflow_dispatch:
  push:
    paths: [scripts/data_check.py, .github/workflows/data-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/data_check.py > out.txt 2>&1 || true
      - run: sed -n '/^| Source/,$p' out.txt >> "$GITHUB_STEP_SUMMARY"
      - run: |
          mkdir -p data && cp out.txt data/data_check.txt
          git config user.name "prop-check-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/data_check.txt && git commit -m "data check results [skip ci]" && git push || true
