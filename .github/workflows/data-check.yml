name: data-check
on:
  workflow_dispatch:
  push:
    paths: [scripts/data_check.py, .github/workflows/data-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/data_check.py | tee out.txt
      - run: tail -n +1 out.txt | sed -n '/^| Source/,$p' >> "$GITHUB_STEP_SUMMARY"
